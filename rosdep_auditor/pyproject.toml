[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosdep-auditor"
version = "0.1.0"
description = "A system for checking rosdep rules against package repositories and identifying equivalent packages across distributions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.14",
    "unidiff>=0.7",
    "zstandard>=0.23",
    "brotli>=1.2",
    "openai>=2.14",
    "sentence-transformers>=5.1",
    "transformers>=4.55",
    "torch>=2.8",
    "scikit-learn>=1.7",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/ros/rosdistro_watcher"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosdep_auditor*"]
